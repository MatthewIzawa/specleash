name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib pytest
      - run: python -m pytest -q
  matlab:
    # MATLAB on GitHub-hosted runners needs no licence for public repositories only,
    # so this job runs once the repository is made public. This matrix and image
    # passed 7/7 on 2026-09-16 (R2021a and R2026a).
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        release: [R2021a, latest]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
      - uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: matlab/tests
